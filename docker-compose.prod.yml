# =====================================================================
# MetroVPS - Spring Boot app only
# ---------------------------------------------------------------------
# Postgres lives in its own stack (docker-compose.postgres.yml).
# This file is re-deployed on every git pull and only restarts the API.
# =====================================================================
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cou-bus-tracker-app
    restart: unless-stopped
    env_file:
      - .env.production
    network_mode: host
    volumes:
      # Persist student ID cards across container rebuilds.
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/buses || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1536M
