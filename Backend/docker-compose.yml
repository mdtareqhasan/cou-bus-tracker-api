version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cou-bus-tracker-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-cou_bus_tracker}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root1234}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-cou_bus_tracker}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: cou-bus-tracker-app
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-cou_bus_tracker}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-root1234}
      JWT_SECRET: ${JWT_SECRET:-YourSuperSecretKeyForJWTTokenGenerationMustBeLongEnough2024!}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
