services:
  postgres:
    image: postgres:16-alpine
    container_name: cou-bus-tracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cou_bus_tracker}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root1234}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Keep the local PostgreSQL server available on 5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cou-bus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-cou_bus_tracker}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    # Build locally so the container uses this project's migrations.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cou-bus-tracker-app
    restart: unless-stopped
    ports:
      # Host port 8080 is already in use on this machine.  Keep Spring Boot
      # listening on 8080 in the container, but expose it as 8081 locally.
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-cou_bus_tracker}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-root1234}
      JWT_SECRET: ${JWT_SECRET:-YourSuperSecretKeyForJWTTokenGenerationMustBeLongEnough2024!}
      FILE_UPLOAD_DIR: /app/uploads
      TZ: Asia/Dhaka
    volumes:
      - uploads_data:/app/uploads
    networks:
      - cou-bus-network
    depends_on:
      postgres:
        condition: service_healthy

networks:
  cou-bus-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
