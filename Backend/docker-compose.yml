services:
  postgres:
    image: postgres:16-alpine
    container_name: cou-bus-tracker-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-cou_bus_tracker}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root1234}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cou-bus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-cou_bus_tracker}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cou-bus-tracker-app
    ports:
      - "8080:8080"
    environment:
      # Override Spring Boot datasource to point at the postgres container
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-cou_bus_tracker}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-root1234}
      # JWT
      JWT_SECRET: ${JWT_SECRET:-YourSuperSecretKeyForJWTTokenGenerationMustBeLongEnough2024!}
      # File upload directory
      FILE_UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    networks:
      - cou-bus-network
    depends_on:
      postgres:
        condition: service_healthy

networks:
  cou-bus-network:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:
