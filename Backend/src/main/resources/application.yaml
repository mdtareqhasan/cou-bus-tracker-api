spring:
  profiles:
    active: dev   # 👈 এটি বলে দিচ্ছে, 'dev' প্রোফাইল ইউজ করো (মানে application-dev.yml লোড করো)

server:
  port: 8080

jwt:
  secret: YourSuperSecretKeyForJWTTokenGenerationMustBeLongEnough2024!
  expiration: 86400000

file:
  upload-dir: ./uploads

google:
  oauth2:
    # Web OAuth client ID used as the audience for Google ID tokens from the Flutter app.
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:111634412431-th7l3d7cqtmrpqhrn16hvs55j2f6f9qa.apps.googleusercontent.com}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.cou.bustracker: DEBUG
    org.springframework.security: DEBUG
