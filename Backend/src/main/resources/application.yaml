spring:
  mail:
    # MailerSend is the default production mail provider. Generic SMTP_* values are
    # still accepted as fallbacks for compatibility with older deployments.
    host: ${MAILERSEND_SMTP_HOST:${SMTP_HOST:${RESEND_SMTP_HOST:smtp.mailersend.net}}}
    port: ${MAILERSEND_SMTP_PORT:${SMTP_PORT:${RESEND_SMTP_PORT:587}}}
    username: ${MAILERSEND_SMTP_USERNAME:${SMTP_USERNAME:${RESEND_SMTP_USERNAME:resend}}}
    password: ${MAILERSEND_SMTP_PASSWORD:${SMTP_PASSWORD:${RESEND_API_KEY:}}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  profiles:
    active: dev   # dev profile remains the default for local runs; Render sets SPRING_PROFILES_ACTIVE=render

server:
  port: 8080

app:
  email-verification:
    from: ${MAILERSEND_FROM_EMAIL:${MAIL_FROM_EMAIL:${RESEND_FROM_EMAIL:}}}
    from-name: ${MAILERSEND_FROM_NAME:${MAIL_FROM_NAME:${RESEND_FROM_NAME:CoU Bus Tracker}}}
    otp-expiry-minutes: ${EMAIL_OTP_EXPIRY_MINUTES:5}
    resend-cooldown-seconds: ${EMAIL_OTP_RESEND_COOLDOWN_SECONDS:60}

jwt:
  secret: YourSuperSecretKeyForJWTTokenGenerationMustBeLongEnough2024!
  expiration: 86400000

file:
  upload-dir: ./uploads

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

google:
  oauth2:
    # Web OAuth client ID used as the audience for Google ID tokens from the Flutter app.
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:111634412431-th7l3d7cqtmrpqhrn16hvs55j2f6f9qa.apps.googleusercontent.com}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.cou.bustracker: DEBUG
    org.springframework.security: DEBUG
