spring:
  mail:
    # Resend SMTP defaults. Generic SMTP_* variables can still override them.
    host: ${SMTP_HOST:${RESEND_SMTP_HOST:smtp.resend.com}}
    port: ${SMTP_PORT:${RESEND_SMTP_PORT:587}}
    username: ${SMTP_USERNAME:${RESEND_SMTP_USERNAME:resend}}
    password: ${SMTP_PASSWORD:${RESEND_API_KEY:}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  profiles:
    active: dev   # 👈 এটি বলে দিচ্ছে, 'dev' প্রোফাইল ইউজ করো (মানে application-dev.yml লোড করো)

server:
  port: 8080

app:
  email-verification:
    from: ${MAIL_FROM_EMAIL:${RESEND_FROM_EMAIL:}}
    from-name: ${MAIL_FROM_NAME:${RESEND_FROM_NAME:CoU Bus Tracker}}
    otp-expiry-minutes: ${EMAIL_OTP_EXPIRY_MINUTES:5}
    resend-cooldown-seconds: ${EMAIL_OTP_RESEND_COOLDOWN_SECONDS:60}

jwt:
  secret: YourSuperSecretKeyForJWTTokenGenerationMustBeLongEnough2024!
  expiration: 86400000

file:
  upload-dir: ./uploads

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

google:
  oauth2:
    # Web OAuth client ID used as the audience for Google ID tokens from the Flutter app.
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:111634412431-th7l3d7cqtmrpqhrn16hvs55j2f6f9qa.apps.googleusercontent.com}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.cou.bustracker: DEBUG
    org.springframework.security: DEBUG
