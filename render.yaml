# Render blueprint: deploy the Spring Boot API as a Docker web service.
#
# Why this exists: the Maven project lives in Backend/ (pom.xml is not at the repo
# root), so Render's native language detection fails ("Detected language: unknown").
# With runtime: docker, Render builds this repo's root Dockerfile and runs its
# ENTRYPOINT, so no Start Command is required.
#
# How to use:
#   1. Push this repo to GitHub.
#   2. Render Dashboard -> New -> Blueprint -> select this repo -> Apply.
#   3. Create a PostgreSQL database (Dashboard -> New -> PostgreSQL).
#   4. On the web service's Environment tab set the vars marked `sync: false`
#      (you are prompted during creation). For the database, copy the values from
#      the PostgreSQL "Connections" tab (Internal Database URL):
#        SPRING_DATASOURCE_URL      jdbc:postgresql://<HOST>:<PORT>/<DATABASE>
#        SPRING_DATASOURCE_USERNAME <USERNAME>
#        SPRING_DATASOURCE_PASSWORD <PASSWORD>
services:
  - type: web
    name: cou-bus-tracker-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/buses
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: JWT_SECRET
        generateValue: true
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: RESEND_FROM_NAME
        value: CoU Bus Tracker

  # ----------------------------------------------------------------------------
  # Admin Panel — React SPA hosted as a Render Static Site.
  #
  # Build/Publish paths in Render Static Sites are relative to the repo root,
  # so we `cd` into the admin-panel folder in the Build Command. The
  # `headers` block ensures Noto Sans Bengali TTF files served from /fonts/
  # have the correct font/ttf MIME type so jsPDF (and future FontFace API use)
  # parse them reliably.
  #
  # `spa: true` adds the single-page rewrite so deep links like /schedules hit
  # index.html and React Router takes over.
  # ----------------------------------------------------------------------------
  - type: web
    name: cou-bus-tracker-admin
    runtime: static
    buildCommand: cd Backend/admin-panel && npm install && npm run build
    staticPublishPath: Backend/admin-panel/dist
    spa: true
    headers:
      - path: /fonts/*
        name: Content-Type
        value: font/ttf
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_API_BASE_URL
        # Production API base URL — must point at the deployed Spring Boot
        # backend (which has CORS whitelisted for the admin frontend origin).
        # Find the actual URL on the Render dashboard for the
        # `cou-bus-tracker-api` service and replace the value below if it
        # differs from the default.
        value: https://cou-bus-tracker-api.onrender.com/api