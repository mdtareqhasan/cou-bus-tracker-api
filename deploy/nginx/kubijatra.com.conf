# ---------------------------------------------------------------------
# Flutter web app.
# ---------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name app.kubijatra.com;

    ssl_certificate     /etc/letsencrypt/live/kubijatra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kubijatra.com/privkey.pem;

    root /var/www/flutter-web;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ---------------------------------------------------------------------
# Plain-HTTP -> HTTPS redirect for every host.
# ---------------------------------------------------------------------
server {
    listen 80;
    server_name api.kubijatra.com admin.kubijatra.com super.kubijatra.com app.kubijatra.com kubijatra.com www.kubijatra.com;
    return 301 https://$host$request_uri;
}

# Root apex - 301 to the user-facing app.
server {
    listen 443 ssl http2;
    server_name kubijatra.com www.kubijatra.com;

    ssl_certificate     /etc/letsencrypt/live/kubijatra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kubijatra.com/privkey.pem;

    return 301 https://app.kubijatra.com$request_uri;
}
