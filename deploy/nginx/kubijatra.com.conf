# =====================================================================
# /etc/nginx/sites-available/kubijatra.com.conf
# =====================================================================
# One server block per frontend that Nginx serves as a static SPA.
# Each block proxies /api/* to the Spring Boot container on 127.0.0.1:8080
# and proxies /uploads/* to the same backend (covers any files that
# are written to ./uploads before being uploaded to Cloudinary).
#
# After editing, run:
#   sudo ln -s /etc/nginx/sites-available/kubijatra.com.conf \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
# =====================================================================

# ---------------------------------------------------------------------
# API only - Spring Boot behind a path prefix.
# ---------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name api.kubijatra.com;

    ssl_certificate     /etc/letsencrypt/live/kubijatra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kubijatra.com/privkey.pem;

    client_max_body_size 10M;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ---------------------------------------------------------------------
# Admin panel - React SPA.
# ---------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name admin.kubijatra.com;

    ssl_certificate     /etc/letsencrypt/live/kubijatra.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kubijatra.com/privkey.pem;

    root /var/www/admin-panel;
    index index.html;

    # Long-cache hashed assets emitted by Vite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Bengali TTFs - keep the same Content-Type that worked on Render.
    location /fonts/ {
        types { } default_type font/ttf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback - all unknown paths hit React Router.
    location / {
        try_files $uri /index.html;
    }

    # Proxy API to backend so the browser can use relative URLs.
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

