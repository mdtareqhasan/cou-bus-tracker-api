# Push notification strings, rendered server-side per device language.
#
# One bundle per app language; this file is the English base AND the fallback
# for any device whose stored language is missing or unsupported (Spring falls
# back to the base bundle before throwing NoSuchMessageException).
#
# Keep the key set in sync with:
#   - messages_bn.properties (translation)
#   - ScheduleChangedEvent.Field (push.field.* keys, via NotificationDispatcher)
# These pushes are fire-and-forget, so a missing key degrades to its own key
# name (see NotificationDispatcher#msg), never to a failed admin write.

# Fallback bus label when the schedule has no bus number.
push.bus.fallback=Bus

# --- Titles: "{0}" is the bus number ---
push.schedule.created.title=New schedule: {0}
push.schedule.updated.title=Schedule updated: {0}
push.schedule.deleted.title=Schedule removed: {0}
push.schedule.activated.title=Service resumed: {0}
push.schedule.deactivated.title=Service paused: {0}

# --- Body lead-ins: "{0}" is the "when" phrase ---
# Each is a complete sentence fragment the dispatcher appends to the bus/route
# header, so they carry their own trailing punctuation.
push.body.created=New trip {0}.
push.body.deleted=No longer runs ({0}).
push.body.activated=Running again; {0}.
push.body.deactivated=Paused ({0}).

# --- "when" phrases: "{0}"/"{1}" are formatted times (12-hour, AM/PM) ---
# The trailing "({days})" is appended by the dispatcher when the schedule has
# days; the parenthesis stays empty-safe there.
push.when.single=departs {0}
push.when.range=departs {0}\u2013{1}
push.when.was.single=was departing {0}
push.when.was.range=was {0}\u2013{1}

# --- Update sentences: "{0}"/"{1}" are formatted times, "{2}" a raw value ---
# One plain-language sentence per changed field, replacing the old field-by-
# field diff. Values are raw display data; missing values become a localized
# placeholder via push.value.none.
push.change.departureFrom=Now departs at {0} (was {1}).
push.change.departureTo=Now departs at {0}.
push.change.arrivalFrom=Now arrives at {0} (was {1}).
push.change.arrivalTo=Now arrives at {0}.
push.change.route=Route is now \u201c{0}\u201d.
push.change.days=Runs {0}.
push.change.busName=Bus name is now \u201c{0}\u201d.
push.change.busNumber=Now runs as bus {0}.
push.change.direction=Now goes {0}.

# --- Placeholder when a value is missing ---
push.value.none=none
