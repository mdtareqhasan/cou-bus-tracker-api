# Push notification strings, rendered server-side per device language.
#
# One bundle per app language; this file is the English base AND the fallback
# for any device whose stored language is missing or unsupported (Spring falls
# back to the base bundle before throwing NoSuchMessageException).
#
# Keep the key set in sync with:
#   - messages_bn.properties (translation)
#   - ScheduleChangedEvent.Field (push.field.* keys, via NotificationDispatcher)
# These pushes are fire-and-forget, so a missing key degrades to its own key
# name (see NotificationDispatcher#msg), never to a failed admin write.

# Fallback bus label when the schedule has no bus number.
push.bus.fallback=Bus

# --- Titles: "{0}" is the bus number ---
push.schedule.created.title=New schedule: {0}
push.schedule.updated.title=Schedule updated: {0}
push.schedule.deleted.title=Schedule removed: {0}
push.schedule.activated.title=Service resumed: {0}
push.schedule.deactivated.title=Service paused: {0}

# --- Body suffixes: "{0}" is the "when" phrase ---
push.body.created={0} added
push.body.deleted={0} no longer runs
push.body.activated={0} is running again
push.body.deactivated={0} is paused for now

# --- "when" phrases: "{0}"/"{1}" are HH:mm times ---
push.when.single=departs {0}
push.when.range=departs {0}\u2013{1}

# --- Update diffs: "{0}" field label, "{1}" old value, "{2}" new value ---
push.change={0}: {1} \u2192 {2}
push.value.none=none
push.field.busNumber=bus
push.field.busName=bus name
push.field.departure=departure
push.field.arrival=arrival
push.field.direction=direction
push.field.start=start
push.field.end=end
push.field.days=days
