# Push notification strings (Bengali) - see messages.properties for the key
# contract and comments. Terminology matches the Flutter ARB files
# (lib/l10n/app_bn.arb): সময়সূচি = schedule, বাস = bus.

push.bus.fallback=বাস

# --- Titles: "{0}" is the bus number ---
push.schedule.created.title=নতুন সময়সূচি: {0}
push.schedule.updated.title=সময়সূচি হালনাগাদ: {0}
push.schedule.deleted.title=সময়সূচি বাতিল করা হয়েছে: {0}
push.schedule.activated.title=সেবা পুনরায় শুরু হয়েছে: {0}
push.schedule.deactivated.title=সেবা সাময়িকভাবে বন্ধ: {0}

# --- Body lead-ins: "{0}" is the "when" phrase ---
push.body.created=নতুন ফেরি {0}।
push.body.deleted=আর চলবে না ({0})।
push.body.activated=পুনরায় চলছে; {0}।
push.body.deactivated=সাময়িকভাবে বন্ধ; {0}।

# --- "when" phrases: "{0}" is a formatted time (12-hour, AM/PM) ---
# Arrival time is deliberately never announced; only departure is.
push.when.single={0} থেকে ছাড়ছে
push.when.was.single=আগে {0} থেকে ছাড়ত

# --- Update sentences: "{0}"/"{1}" are formatted times, "{2}" a raw value ---
push.change.departureFrom=এখন {0} এ ছাড়ছে (আগে {1})।
push.change.departureTo=এখন {0} এ ছাড়ছে।
push.change.route=রুট এখন \u201c{0}\u201d।
push.change.days=চলে {0}।
push.change.busName=বাসের নাম এখন \u201c{0}\u201d।
push.change.busNumber=এখন বাস নম্বর {0}।
push.change.direction=এখন দিক {0}।

# --- Placeholder when a value is missing ---
push.value.none=নেই
