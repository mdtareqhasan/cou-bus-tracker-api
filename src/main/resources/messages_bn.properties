# Push notification strings (Bengali) - see messages.properties for the key
# contract and comments. Terminology matches the Flutter ARB files
# (lib/l10n/app_bn.arb): সময়সূচি = schedule, বাস = bus.

push.bus.fallback=বাস

# --- Titles: "{0}" is the bus number ---
push.schedule.created.title=নতুন সময়সূচি: {0}
push.schedule.updated.title=সময়সূচি হালনাগাদ: {0}
push.schedule.deleted.title=সময়সূচি বাতিল করা হয়েছে: {0}
push.schedule.activated.title=সেবা পুনরায় শুরু হয়েছে: {0}
push.schedule.deactivated.title=সেবা সাময়িকভাবে বন্ধ: {0}

# --- Body suffixes: "{0}" is the "when" phrase ---
push.body.created={0} যোগ করা হয়েছে
push.body.deleted={0} আর চলবে না
push.body.activated={0} পুনরায় চলছে
push.body.deactivated={0} এখন সাময়িকভাবে বন্ধ আছে

# --- "when" phrases: "{0}"/"{1}" are HH:mm times ---
push.when.single={0} থেকে ছাড়ছে
push.when.range={0}\u2013{1} ছাড়ছে

# --- Update diffs: "{0}" field label, "{1}" old value, "{2}" new value ---
push.change={0}: {1} \u2192 {2}
push.value.none=নেই
push.field.busNumber=বাস
push.field.busNameBn=বাসের নাম (বাংলা)
push.field.busNameEn=বাসের নাম (ইংরেজি)
push.field.departure=ছাড়ার সময়
push.field.arrival=পৌঁছার সময়
push.field.direction=দিক
push.field.routeNameBn=রুটের নাম (বাংলা)
push.field.routeNameEn=রুটের নাম (ইংরেজি)
push.field.days=দিন
