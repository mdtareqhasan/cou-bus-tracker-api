spring:
  profiles:
    active: dev
  messages:
    # Push notification bundles (classpath:messages*.properties). Rendered
    # server-side per device language, so fallback must be deterministic:
    # unknown locale → base bundle (English), never the server's system locale.
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
    cache-duration: 30

server:
  port: 8080

app:
  email-verification:
    otp-expiry-minutes: 10

# Actuator is on the classpath for its built-in health indicators (DataSource
# DB check feeds /api/health). Only expose the standard health endpoint here;
# /api/health is the canonical, richer status route and stays public via
# SecurityConfig.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # Public endpoint: statuses only, never connection/error details.
      show-details: never

jwt:
  secret: YourSuperSecretKeyForJWTTokenGenerationMustBeLongEnough2024!
  # 90 days (3 months) in milliseconds. This is the whole session lifetime for
  # every role - there is no refresh-token flow.
  expiration: 7776000000

file:
  upload-dir: ./uploads

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

google:
  oauth2:
    # Web OAuth client ID used as the audience for Google ID tokens from the
    # Flutter app. Must match the client_type 3 entry in google-services.json.
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:601520130344-b0s8fni9k71ktjhbcvtqbi74k4itpkps.apps.googleusercontent.com}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.cou.bustracker: DEBUG
    org.springframework.security: DEBUG
