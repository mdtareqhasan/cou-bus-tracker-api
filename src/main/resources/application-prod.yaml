spring:
  config:
    activate:
      on-profile: prod

  datasource:
    # Reaches the host-network Postgres container via host.docker.internal.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://host.docker.internal:5432/cou_bus_tracker}
    username: ${SPRING_DATASOURCE_USERNAME:cou_bus_tracker}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 11
    repair-on-migrate: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${PORT:8080}
  # Behind Nginx - trust the X-Forwarded-* headers it sets.
  forward-headers-strategy: framework
  tomcat:
    remoteip:
      protocol-header: X-Forwarded-Proto
      remote-ip-header: X-Forwarded-For

jwt:
  secret: ${JWT_SECRET:}
  # 90 days (3 months) in milliseconds. Override with JWT_EXPIRATION (also ms).
  expiration: ${JWT_EXPIRATION:7776000000}

file:
  upload-dir: ./uploads

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.cou.bustracker: INFO
    org.springframework.security: WARN